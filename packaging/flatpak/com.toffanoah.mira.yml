# Flatpak de MIRA. Construction : flatpak-builder --user --install --force-clean out/flatpak flatpak/com.toffanoah.mira.yml
# Ce manifeste installe l'archive précompilée (packaging/tarball.sh) ; Flathub demandera une construction depuis les sources.
app-id: com.toffanoah.mira
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: mira-mail
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-download
modules:
  - name: mira-mail
    buildsystem: simple
    sources:
      - type: archive
        path: ../out/mira-mail-2.2.1-x86_64.tar.gz
    build-commands:
      - install -d /app/lib/mira-mail /app/bin
      - cp -a app/. /app/lib/mira-mail/
      - ln -s ../lib/mira-mail/mira /app/bin/mira-mail
      - sed 's|^Exec=.*|Exec=mira-mail|' share/com.toffanoah.mira.desktop > com.toffanoah.mira.desktop
      - install -Dm644 com.toffanoah.mira.desktop /app/share/applications/com.toffanoah.mira.desktop
      - install -Dm644 share/com.toffanoah.mira.png /app/share/icons/hicolor/512x512/apps/com.toffanoah.mira.png
      - install -Dm644 share/com.toffanoah.mira.svg /app/share/icons/hicolor/scalable/apps/com.toffanoah.mira.svg
      - install -Dm644 share/LICENSE /app/share/licenses/com.toffanoah.mira/LICENSE
      - install -Dm644 share/com.toffanoah.mira.metainfo.xml /app/share/metainfo/com.toffanoah.mira.metainfo.xml
