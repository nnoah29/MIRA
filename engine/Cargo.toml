[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
mira-vocabulary = { path = "crates/mira-vocabulary" }
mira-core = { path = "crates/mira-core" }
mira-provider-gmail = { path = "crates/mira-provider-gmail" }
mira-provider-outlook = { path = "crates/mira-provider-outlook" }
mira-provider-yahoo = { path = "crates/mira-provider-yahoo" }
mira-provider-generic = { path = "crates/mira-provider-generic" }
mira-assembly = { path = "crates/mira-assembly" }
mira-testkit = { path = "crates/mira-testkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
ring = "0.17"
uuid = { version = "1.28", features = ["v7"] }
rusqlite = { version = "0.40", features = ["bundled"] }
zstd = "0.14"
mail-parser = "0.11"
mail-builder = "1.0"
ammonia = "4.2"
keyring = "4.2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tracing = "0.1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
proptest = "1"
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"
ratatui = "0.30"
crossterm = "0.29"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
