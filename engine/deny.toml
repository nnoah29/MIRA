[graph]
all-features = true

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0", "BSL-1.0", "0BSD"]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [{ name = "libloading" }, { name = "openssl-sys" }, { name = "openssl" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
