[graph]
all-features = true

[licenses]
allow = ["MIT", "Unlicense", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0", "BSL-1.0", "0BSD"]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [{ name = "libloading" }, { name = "openssl-sys" }, { name = "openssl" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono non maintenu, aucune alternative corrigée ; usage limité à mira-host" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names non maintenu, dépendance transitive du trousseau Linux" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant non maintenu, dépendance transitive du trousseau Linux" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive non maintenu, dépendance transitive du trousseau Linux" },
]
