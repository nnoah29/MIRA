name: windows
on:
  workflow_dispatch:
  pull_request:
    paths: ["engine/**", "bridge/**", "app/**", "packaging/windows/**", ".github/workflows/windows.yml"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - name: Moteur et hôte (compilation)
        working-directory: engine
        run: cargo check -p mira-core -p mira-host
      - name: Serveur local (archive épinglée, somme, extraction, lancement)
        shell: pwsh
        run: |
          $url = "https://github.com/ggml-org/llama.cpp/releases/download/b12224/llama-b12224-bin-win-cpu-x64.zip"
          $sha = "d7a7a3e014a02dbfce46977f9da6d9b58196b9c83b80bcf6ef2337134103c3d6"
          Invoke-WebRequest $url -OutFile server.zip
          if ((Get-FileHash server.zip -Algorithm SHA256).Hash.ToLower() -ne $sha) { throw "somme de l'archive différente" }
          Expand-Archive server.zip -DestinationPath server
          $exe = Get-ChildItem server -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $exe) { throw "llama-server.exe absent de l'archive" }
          & $exe.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "le serveur ne se lance pas" }
      - name: Démon (compilation et fichier du port)
        working-directory: engine
        run: |
          cargo build --release -p mira-daemon
          cargo test -p mira-daemon --test port_file
      - name: Pont FFI (bibliothèque)
        working-directory: bridge
        run: cargo build --release
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Application Windows
        working-directory: app
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: |
          flutter pub get
          flutter build windows --release
      - name: Installeur (génération, installation, démon, désinstallation)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          packaging\windows\build-installer.ps1 -Version 0.0.0 -OutDir out
          packaging\windows\test-installer.ps1 -Setup (Resolve-Path out\mira-mail-0.0.0-windows-x64-setup.exe)
