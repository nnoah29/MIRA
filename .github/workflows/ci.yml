name: ci
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
jobs:
  engine:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99.0", components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "engine -> target" }
      - run: sudo apt-get update && sudo apt-get install -y dbus libdbus-1-dev libsecret-1-dev pkg-config
      - name: CI du moteur
        run: ./ci.sh
  app:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99.0" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.7", channel: stable }
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev dbus
      - name: Pont et application
        run: make bridge-test app-analyze app-test
