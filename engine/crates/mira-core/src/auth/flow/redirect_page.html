:root{--bg:#1b1b1b;--line:#333;--text:#ecebe6;--muted:#adaca5;--dim:#8b8a84;--accent:#e8542b;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f3f1ea;--line:#cdc9bd;--text:#1d1c1a;--muted:#4b4943;--dim:#6b685f;--accent:#d6431a;color-scheme:light}}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--muted);font:400 17px/1.6 system-ui,"Hanken Grotesk","Segoe UI",sans-serif;background:radial-gradient(900px 520px at 85% -10%,rgba(232,84,43,.10),transparent 60%),var(--bg)}
main{position:relative;width:min(580px,100%);padding:52px 48px 44px 52px}
.frame{color:var(--accent);position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:44px;color:var(--accent)}
.brand svg{width:30px;height:30px;display:block}
.brand b{font:400 26px/1 Anton,Impact,sans-serif;letter-spacing:.03em;color:var(--text)}
.brand i{font-style:normal;color:var(--accent)}
h1{font:400 clamp(34px,9vw,56px)/1.02 Anton,Impact,"Arial Narrow",sans-serif;text-transform:uppercase;color:var(--text)}
h1 span{display:inline-block;width:.32em;height:.07em;margin-left:.08em;background:var(--accent)}
p{max-width:44ch}
.fr{margin-top:34px;font-size:19px;line-height:1.55;color:var(--text)}
.en{margin-top:10px;color:var(--dim)}
.note{margin-top:44px;font:500 11px/1.6 ui-monospace,"JetBrains Mono",Consolas,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
@media (max-width:480px){main{padding:40px 28px 36px 32px}}
</style>
