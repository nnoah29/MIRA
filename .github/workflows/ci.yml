name: ci
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
jobs:
  engine:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master du 2026-11-15
        with: { toolchain: "1.99.0", components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: "engine -> target" }
      - run: sudo apt-get update && sudo apt-get install -y dbus libdbus-1-dev libsecret-1-dev pkg-config
      - name: CI du moteur
        run: ./ci.sh
  app:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master du 2026-11-15
        with: { toolchain: "1.99.0" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version: "3.47.7", channel: stable }
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev dbus
      - name: Pont et application
        run: make bridge-test app-analyze app-test
