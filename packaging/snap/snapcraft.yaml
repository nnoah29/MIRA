# Snap de MIRA. Construction : cd packaging && snapcraft (après packaging/tarball.sh).
name: mira-mail
title: MIRA
base: core22
version: '2.2.1'
summary: Desktop mail client that works offline
description: |
  MIRA keeps a full copy of your mail on your own computer, so everything
  opens instantly, works without a connection, and stays yours.
  Connect Gmail, Outlook, Yahoo or any IMAP account and read, sort, search
  and write from a single, calm interface.
license: MIT
grade: stable
confinement: strict
architectures:
  - build-on: amd64

apps:
  mira-mail:
    command: usr/lib/mira-mail/mira
    desktop: usr/share/applications/com.toffanoah.mira.desktop
    extensions: [gnome]
    common-id: com.toffanoah.mira
    plugs:
      - network
      - home
      - password-manager-service

parts:
  mira-mail:
    plugin: dump
    source: out/mira-mail-2.2.1-x86_64.tar.gz
    override-build: |
      install -d $CRAFT_PART_INSTALL/usr/lib/mira-mail
      cp -a app/. $CRAFT_PART_INSTALL/usr/lib/mira-mail/
      sed 's|^Exec=.*|Exec=mira-mail|; s|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/512x512/apps/com.toffanoah.mira.png|' \
        share/com.toffanoah.mira.desktop > com.toffanoah.mira.desktop
      install -Dm644 com.toffanoah.mira.desktop $CRAFT_PART_INSTALL/usr/share/applications/com.toffanoah.mira.desktop
      install -Dm644 share/com.toffanoah.mira.png $CRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps/com.toffanoah.mira.png
      install -Dm644 share/LICENSE $CRAFT_PART_INSTALL/usr/share/licenses/mira-mail/LICENSE
      install -Dm644 share/com.toffanoah.mira.metainfo.xml $CRAFT_PART_INSTALL/usr/share/metainfo/com.toffanoah.mira.metainfo.xml
